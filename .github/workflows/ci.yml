name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run all tests (pytest)
        env:
          AZURE_OPENAI_ENDPOINT: ""
          AZURE_OPENAI_API_KEY: ""
        run: python3 -m pytest tests/ -v --tb=short
      - name: Validate Security Copilot manifests
        run: python3 security-copilot/validate_manifests.py
      - name: Validate OpenAPI spec has all required paths
        run: |
          python3 -c "
          import json, sys
          spec = json.load(open('services/foundry_runtime/openapi.json'))
          required = {'/health', '/v1/lifecycle', '/v1/artifacts', '/v1/stages', '/v1/containment/approve'}
          missing = required - set(spec['paths'].keys())
          if missing:
              print('Missing OpenAPI paths:', missing); sys.exit(1)
          print('OpenAPI spec OK — all', len(spec['paths']), 'paths present')
          "
      - name: Require lifecycle artifacts
        run: |
          test -f output/finding.json
          test -f output/remediation.json
          test -f output/owasp-coverage.json
          test -f output/attack.json
          test -f output/incident.json
          test -f output/powerbi-risk-dataset.csv
          test -f output/executive-dashboard.html
          test -f output/a2a-messages.json
          test -f output/retest.json
          test -f output/framework-coverage.json

